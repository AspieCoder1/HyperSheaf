[project]
name = "hypersheaf"
version = "0.1.0"
authors = [
    {name="Luke Braithwaite", email="lukebraithwaite7@gmail.com"}
]
description = "Python library for working with Sheah Graph and Hypergraph Neural Networks for Heterogeneous Data"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "torch==2.8.0",
    "torch-geometric>=2.6.1",
    "pyg-lib",
    "torch-cluster",
    "torch-scatter",
    "torch-sparse",
    "torch-spline-conv",
    "strenum>=0.4.15",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
required-environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
pyg-lib = [
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcpu/pyg_lib-0.4.0%2Bpt28-cp313-cp313-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'"},
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/pyg_lib-0.4.0%2Bpt28cu128-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'"}
]
torch-cluster = [
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcpu/torch_cluster-1.6.3-cp313-cp313-macosx_10_13_universal2.whl", marker = "sys_platform == 'darwin'"},
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_cluster-1.6.3%2Bpt28cu128-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'"}
]
torch-scatter = [
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcpu/torch_scatter-2.1.2-cp313-cp313-macosx_10_13_universal2.whl", marker = "sys_platform == 'darwin'"},
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_scatter-2.1.2%2Bpt28cu128-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'"}
]
torch-sparse = [
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcpu/torch_sparse-0.6.18-cp313-cp313-macosx_11_0_universal2.whl", marker = "sys_platform == 'darwin'"},
    { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_sparse-0.6.18%2Bpt28cu128-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'"}
]
torch-spline-conv = [
    { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_spline_conv-1.2.2-cp313-cp313-macosx_10_13_universal2.whl", marker = "sys_platform == 'darwin'"},
    { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu128/torch_spline_conv-1.2.2%2Bpt27cu128-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'"}
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.ruff]
src = ["src/hypersheaf"]
line-length=88

[tool.ruff.format]
quote-style="double"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "D",  # pydocstyle
    "E",
]
ignore = [
    "D100",  # TODO Don't ignore "Missing docstring in public module"
    "D101",  # TODO Don't ignore "Missing docstring in public class"
    "D102",  # TODO Don't ignore "Missing docstring in public method"
    "D103",  # TODO Don't ignore "Missing docstring in public function"
    "D104",  # TODO Don't ignore "Missing docstring in public package"
    "D105",  # Ignore "Missing docstring in magic method"
    "D107",  # Ignore "Missing docstring in __init__"
    "D205",  # Ignore "blank line required between summary line and description"
]
exclude=["test_*.py", "conftest.py"]


[tool.ruff.lint.pydocstyle]
convention="google"

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'def reset_parameters',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

